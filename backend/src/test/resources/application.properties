spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=create-drop

# Mail configuration for tests - uses dummy values
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Rate-Limiting im Testprofil deaktiviert: sonst teilen sich unabhängige
# Tests über die ganze Suite hinweg dieselbe MockMvc-Test-IP/denselben
# In-Memory-Zustand und blockieren sich gegenseitig mit 429.
rate-limit.enabled=false
