<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="map" style="height: 500px;"></div>

<script>
    async function initMap() {
        const res = await fetch('http://localhost:8080/activities');
        document.getElementById('map').innerHTML = await res.json();
    }
    initMap();

</script>
</body>
</html>
